name: Sync All Branches

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sync-all-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Rebase branches onto their current bases
        env:
          GH_TOKEN: ${{ secrets.SYNC_BRANCHES_TOKEN || github.token }}
          FORK: ${{ github.repository }}
        run: python3 .github/workflows/scripts/sync-all-branches.py
